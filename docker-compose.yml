# Infraestructura local del chat.
#
# Puerto 5447 según proyectos/00-base/PLANTILLA.md, para que conviva con el
# SaaS (5433), las citas (5434) y el marketplace (5442).
#
# La imagen es pgvector y no postgres a secas: los embeddings viven en la misma
# base que los mensajes, que es la razón de no tener una base vectorial aparte.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aichat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aichat}
    ports:
      - '5447:5432'
    volumes:
      - aichat_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aichat}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aichat_pgdata:
